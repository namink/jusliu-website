<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="cb" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#88a8ff"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#faf9ff"/>
  <!-- V left arm -->
  <polygon points="5,6 10,6 16,28 12,28" fill="url(#cp)" opacity="0.9"/>
  <!-- V right arm -->
  <polygon points="16,28 20,28 26,6 22,6" fill="url(#cb)" opacity="0.9"/>
  <!-- A left leg -->
  <polygon points="12,28 16,28 14,10 10,12" fill="url(#cp)" opacity="0.85"/>
  <!-- A right leg -->
  <polygon points="20,28 24,28 28,10 24,8" fill="url(#cb)" opacity="0.85"/>
  <!-- A crossbar -->
  <rect x="13" y="15" width="14" height="3.5" rx="1.5" fill="#88a8ff" opacity="0.8"/>
  <!-- Center prism highlight -->
  <polygon points="14,20 16,12 20,20" fill="#fff" opacity="0.6"/>
  <!-- Edge highlight lines -->
  <line x1="10" y1="6" x2="2" y2="28" stroke="#fff" stroke-width="0.3" opacity="0.3"/>
  <line x1="22" y1="6" x2="30" y2="28" stroke="#fff" stroke-width="0.3" opacity="0.3"/>
</svg>
